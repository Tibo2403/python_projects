name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install pytest ruff
      - name: Syntax check
        run: python -m compileall -q .
      - name: Lint (syntax errors only)
        run: python -m ruff check --select E9 .
      - name: Unit tests
        run: python -m pytest -q corporate_finance_berk peb
