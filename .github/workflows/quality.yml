name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Check syntax
        run: python -m compileall -q .
      - name: Ruff critical checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Run available tests
        run: pytest
