[project]
name = "price-arbitrage-tool"
version = "0.1.0"
description = "CSV-based marketplace arbitrage calculator for authorized product data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
price-arbitrage = "arbitrage:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
