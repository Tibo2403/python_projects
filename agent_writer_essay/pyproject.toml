[project]
name = "agent-writer-essay"
version = "0.1.0"
description = "LangGraph essay-writing agent with CLI and local Gradio interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "python-dotenv",
  "langchain-core",
  "langchain-openai",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "tavily-python",
  "gradio",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-writer-essay = "agent_writer_essay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
